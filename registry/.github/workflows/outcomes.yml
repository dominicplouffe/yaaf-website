name: Outcomes

# Nightly: count the "Outcome:" issues yaaf opens when a project chooses to
# say how a listing went, then republish the index if the numbers moved.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: read

jobs:
  outcomes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: count the reports
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/issues?state=all&per_page=100" > pages.json
          python -c "import json; json.dump([i for page in json.load(open('pages.json')) for i in page], open('issues.json','w'))"
          python tools/outcomes.py issues.json > outcomes.json
      - name: commit if they moved
        run: |
          if git diff --quiet -- outcomes.json; then exit 0; fi
          git config user.name "yaaf-marketplace-bot"
          git config user.email "noreply@github.com"
          git add outcomes.json
          git commit -m "Outcomes: $(date -u +%F)"
          git push
